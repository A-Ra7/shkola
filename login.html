<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма авторизации</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .login-wrapper {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            min-height: 550px;
            display: flex;
            position: relative;
        }
        
        .login-form-container {
            width: 100%;
            display: flex;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.6s ease-in-out;
        }

        .login-title {
            text-align: center;
        }

        .login-subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .login-input-group {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }
        
        .login-input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #764ba2;
            font-size: 18px;
        }
        
        .login-input {
            width: 100%;
            padding: 12px 12px 12px 50px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .login-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
            outline: none;
        }
        
        .login-options {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .login-remember {
            display: flex;
            align-items: center;
        }
        
        .login-remember .login-input {
            width: auto;
            margin-right: 8px;
        }
        
        .login-forgot-password {
            color: #764ba2;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .login-forgot-password:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        .login-btn {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .login-btn:active {
            transform: translateY(-1px);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }
        
        .signup-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .signup-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                min-height: auto;
            }
            
            .login-form-container {
                padding: 25px 20px;
            }

            .login-title {
                font-size: 26px;
            }

            .login-subtitle {
                font-size: 16px;
                margin-bottom: 25px;
            }

            .login-input {
                padding: 10px 10px 10px 42px;
                font-size: 15px;
            }

            .login-input-group i {
                font-size: 16px;
                left: 12px;
            }

            .login-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
                margin-bottom: 20px;
            }

            .login-btn {
                padding: 10px 24px;
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 10px;
            }

            .login-form-container {
                padding: 20px 15px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-subtitle {
                font-size: 14px;
            }

            .login-input {
                padding: 10px 10px 10px 38px;
                font-size: 14px;
            }

            .login-btn {
                padding: 10px 20px;
                font-size: 15px;
            }
        }
        
        .login-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .shake {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-form-container">
                <h1 class="login-title">Вход в аккаунт</h1>
                <p class="login-subtitle">Пожалуйста, введите свои данные</p>
                
                <form id="login-form">
                    <div class="login-input-group">
                        <i class="fas fa-user"></i>
                        <input class="login-input" type="text" id="login-username" placeholder="Имя пользователя" required>
                        <div class="login-error" id="login-username-error">Пожалуйста, введите имя пользователя</div>
                    </div>
                    
                    <div class="login-input-group">
                        <i class="fas fa-lock"></i>
                        <input class="login-input" type="password" id="login-password" placeholder="Пароль" required>
                        <div class="login-error" id="login-password-error">Пожалуйста, введите пароль</div>
                    </div>
                    
                    <div class="login-options">
                        <div class="login-remember">
                            <input class="login-input" type="checkbox" id="login-remember">
                            <label for="login-remember">Запомнить меня</label>
                        </div>
                        <a href="#" class="login-forgot-password">Забыли пароль?</a>
                    </div>
                    
                    <button type="submit" class="login-btn">Войти</button>
                </form>
                
                <div class="signup-link">
                    Ещё нет аккаунта? <a href="#">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
  

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const usernameError = document.getElementById('login-username-error');
            const passwordError = document.getElementById('login-password-error');
            let isValid = true;
            
            // Сбросить сообщения об ошибках
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';
            
            // Проверка имени пользователя
            if (!username) {
                usernameError.style.display = 'block';
                document.getElementById('login-username').classList.add('shake');
                isValid = false;
                
                setTimeout(() => {
                    document.getElementById('login-username').classList.remove('shake');
                }, 500);
            }
            
            // Проверка пароля
            if (!password) {
                passwordError.style.display = 'block';
                document.getElementById('login-password').classList.add('shake');
                isValid = false;
                
                setTimeout(() => {
                    document.getElementById('login-password').classList.remove('shake');
                }, 500);
            }
            
            // Если форма валидна, показать сообщение
            if (isValid) {
                alert('Авторизация успешна!\nИмя пользователя: ' + username + '\nПароль: ' + password);
            }
        });
    </script>
</body>
</html>
