<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Школа Мечты 3Д</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 100%);
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 20px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 100;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }
        #musicControls {
            position: absolute;
            top: 60px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        #musicToggle {
            background: none;
            border: 1px solid white;
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Стили для кнопок управления */
        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 200;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid #ffaa00;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            min-width: 200px;
            text-align: center;
        }
        .action-btn:hover {
            background: #ffaa00;
            color: black;
            transform: scale(1.05);
        }
        .action-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: #999;
        }
        .action-btn.secondary {
            border-color: #44aaff;
        }
        .action-btn.secondary:hover {
            background: #44aaff;
        }
        .action-btn.tertiary {
            border-color: #55cc55;
        }
        .action-btn.tertiary:hover {
            background: #55cc55;
        }

        /* Мобильная версия */
        @media (max-width: 1000px) {
            #controls {
                display: none;
            }
            #info {
                font-size: 18px;
                top: 10px;
            }
            #musicControls {
                top: auto;
                top: 40px;
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                background: rgba(0, 0, 0, 0.8);
                border: 2px solid #ffaa00;
                padding: 7px 20px;
                font-size: 16px;
                width: auto;
                justify-content: center;
            }
            .action-buttons {
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                width: 90%;
                align-items: center;
            }
            .action-btn {
                padding: 7px 20px;
                font-size: 16px;
                max-width: 250px;
            }
        }

        @media (max-width: 480px) {
            #info {
                font-size: 16px;
                top: 8px;
            }
            #musicControls {
                top: 32px;
                padding: 5px 14px;
                font-size: 14px;
            }
            .action-buttons {
                bottom: 8px;
                width: 95%;
                gap: 6px;
            }
            .action-btn {
                padding: 6px 14px;
                font-size: 14px;
                min-width: auto;
                width: 100%;
                max-width: 220px;
            }
        }

        /* Скрываем подсказки */
        #interactionHint, #floorHint, #buildingHint {
            display: none;
        }

        /* Прелоадер поворота телефона */
        #rotate-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            gap: 20px;
        }

        .rotate-icon {
            width: 80px;
            height: 80px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .rotate-text {
            font-size: 20px;
            font-weight: 600;
            padding: 0 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .rotate-subtext {
            font-size: 14px;
            opacity: 0.85;
            padding: 0 30px;
        }

        /* Показываем прелоадер на мобильных в портретной ориентации */
        @media screen and (max-width: 1000px) and (orientation: portrait) {
            #rotate-hint {
                display: flex;
            }
            #info, #controls, #musicControls, .action-buttons {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">
        <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12" y2="18"/>
        </svg>
        <div class="rotate-text">Поверните телефон</div>
        <div class="rotate-subtext">Для лучшего просмотра 3D-модели поверните устройство в горизонтальное положение</div>
    </div>
    
    <div id="info">Школа Мечты 3Д</div>
    <div id="controls">
        <strong>Управление:</strong><br>
        • ЛКМ + движение = вращение камеры<br>
        • ПКМ + движение = перемещение камеры<br>
        • Колёсико мыши = приближение/отдаление<br>
        • Используйте кнопки справа для перемещения
    </div>
    
    <div id="musicControls">
        <span>🎵</span>
        <button id="musicToggle">Включить</button>
    </div>
    
    <!-- Кнопки управления вместо клавиш -->
    <div class="action-buttons">
        <button id="btnFloor" class="action-btn secondary" style="display:none">⬆️ 2-й этаж</button>
        <button id="btnBuilding" class="action-btn tertiary" style="display:none">🏫 Второй корпус</button>
        <button id="btnEnterExit" class="action-btn">🚪 Войти в школу</button>
    </div>
    
    <audio id="backgroundMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Управление музыкой
        const backgroundMusic = document.getElementById('backgroundMusic');
        const musicToggle = document.getElementById('musicToggle');
        let isMusicPlaying = false;
        
        musicToggle.addEventListener('click', function() {
            if (isMusicPlaying) {
                backgroundMusic.pause();
                musicToggle.textContent = 'Включить';
            } else {
                backgroundMusic.play().catch(e => {
                    console.log("Автовоспроизведение заблокировано. Нажмите на кнопку еще раз.");
                });
                musicToggle.textContent = 'Выключить';
            }
            isMusicPlaying = !isMusicPlaying;
        });
        
        // Попытка автоматического запуска музыки (может быть заблокирована браузером)
        window.addEventListener('click', function() {
            if (!isMusicPlaying && document.hidden === false) {
                backgroundMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.textContent = 'Выключить';
                }).catch(e => {
                    // Автовоспроизведение заблокировано, требуется действие пользователя
                    console.log("Для воспроизведения музыки нажмите кнопку 'Включить'");
                });
            }
        }, { once: true });
        
        // Инициализация сцены
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xE0F6FF);
        
        // Камера
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 40, 80);
        
        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Обработка изменения размера окна / поворота телефона
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', function() {
            setTimeout(onWindowResize, 100);
        });

        // Управление камерой
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10; // Минимальное расстояние приближения
        controls.maxDistance = 150; // Максимальное расстояние удаления
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);
        
        // Несколько directional lights с разных сторон для равномерного освещения
        const sunLight1 = new THREE.DirectionalLight(0xffffff, 0.2);
        sunLight1.position.set(15, 25, 15);
        sunLight1.castShadow = true;
        sunLight1.shadow.mapSize.width = 1024;
        sunLight1.shadow.mapSize.height = 1024;
        scene.add(sunLight1);
        
        const sunLight2 = new THREE.DirectionalLight(0xffffff, 0.2);
        sunLight2.position.set(-15, 25, 15);
        scene.add(sunLight2);
        
        const sunLight3 = new THREE.DirectionalLight(0xffffff, 0.2);
        sunLight3.position.set(15, 25, -15);
        scene.add(sunLight3);
        
        const sunLight4 = new THREE.DirectionalLight(0xffffff, 0.2);
        sunLight4.position.set(-15, 25, -15);
        scene.add(sunLight4);
        
        // Дополнительное освещение сверху для яркого неба
        const skyLight = new THREE.HemisphereLight(0xffffff, 0xE0F6FF, 0.7);
        skyLight.position.set(0, 50, 0);
        scene.add(skyLight);
        
        // Массив для хранения зон столкновений (непроходимых зон)
        const collisionZones = [];
        
        // Зоны, где нельзя размещать деревья (дорожки, спортивная площадка)
        const noTreeZones = [];

        // Баскетбольные мячи
        const basketballs = [];
        
        // Внутренние стены школы
        const interiorWalls = [];
        
        // Зоны столкновений для камеры внутри школы
        const interiorCollisionZones = [];
        
        let isInsideSchool = false;
        let currentFloor = 1; // 1 - первый этаж, 2 - второй этаж
        let currentBuilding = 1; // 1 - первый корпус, 2 - второй корпус
        
        // Переменная для хранения последней валидной позиции камеры
        let lastValidPosition = new THREE.Vector3();
        
        // Группы для внешней и внутренней сцены
        const exteriorGroup = new THREE.Group();
        const interiorGroup = new THREE.Group();
        const interiorSecondFloorGroup = new THREE.Group();
        const interiorSecondBuildingGroup = new THREE.Group();
        const interiorSecondBuildingSecondFloorGroup = new THREE.Group(); // 2 этаж 2 корпуса
        
        // Изначально показываем только внешнюю сцену
        scene.add(exteriorGroup);
        interiorGroup.visible = false;
        interiorSecondFloorGroup.visible = false;
        interiorSecondBuildingGroup.visible = false;
        interiorSecondBuildingSecondFloorGroup.visible = false;
        scene.add(interiorGroup);
        scene.add(interiorSecondFloorGroup);
        scene.add(interiorSecondBuildingGroup);
        scene.add(interiorSecondBuildingSecondFloorGroup);
        
        // Функция для проверки столкновений камеры с внутренними стенами
        function checkCameraInteriorCollision(newPosition) {
            const cameraRadius = 1.0; // Радиус камеры для столкновений
            
            for (const zone of interiorCollisionZones) {
                const dx = Math.abs(newPosition.x - zone.x);
                const dz = Math.abs(newPosition.z - zone.z);
                
                if (dx < (zone.width / 2 + cameraRadius) && 
                    dz < (zone.depth / 2 + cameraRadius)) {
                    return true; // Столкновение обнаружено
                }
            }
            return false; // Столкновений нет
        }
        
        // Функция для создания зон столкновений в классах
        function addClassroomCollisionZones(classroom, x, z, width, depth) {
            interiorCollisionZones.push({
                x: x,
                z: z,
                width: width,
                depth: depth
            });
            
            // Добавляем стены класса как препятствия
            interiorCollisionZones.push({
                x: x - width/2 + 0.1,
                z: z,
                width: 0.2,
                depth: depth
            });
            
            interiorCollisionZones.push({
                x: x + width/2 - 0.1,
                z: z,
                width: 0.2,
                depth: depth
            });
            
            interiorCollisionZones.push({
                x: x,
                z: z - depth/2 + 0.1,
                width: width,
                depth: 0.2
            });
            
            interiorCollisionZones.push({
                x: x,
                z: z + depth/2 - 0.1,
                width: width,
                depth: 0.2
            });
        }
        
        // Добавляем зоны столкновений для коридоров
        function addCorridorCollisionZones() {
            // Главный коридор первого этажа
            interiorCollisionZones.push({
                x: 0,
                z: 0,
                width: 28,
                depth: 23
            });
            
            // Коридор второго этажа
            interiorCollisionZones.push({
                x: 0,
                z: 0,
                width: 28,
                depth: 23
            });
            
            // Лестничная клетка
            interiorCollisionZones.push({
                x: -10,
                z: 4,
                width: 4,
                depth: 8
            });
        }
        
        // Функция для проверки столкновений с любыми объектами
        function checkAnyCollision(x, z, radius) {
            for (const zone of collisionZones) {
                const dx = Math.abs(x - zone.x);
                const dz = Math.abs(z - zone.z);
                
                if (dx < (zone.width / 2 + radius) && 
                    dz < (zone.depth / 2 + radius)) {
                    return true; // Столкновение обнаружено
                }
            }
            return false; // Столкновений нет
        }
        
        // Функция для проверки столкновений с внутренними стенами
        function checkInteriorCollision(x, z, radius) {
            for (const zone of interiorWalls) {
                const dx = Math.abs(x - zone.x);
                const dz = Math.abs(z - zone.z);
                
                if (dx < (zone.width / 2 + radius) && 
                    dz < (zone.depth / 2 + radius)) {
                    return true; // Столкновение обнаружено
                }
            }
            return false; // Столкновений нет
        }
        
        // Функция для проверки, находится ли точка в запретной зоне для деревьев
        function isInNoTreeZone(x, z, radius) {
            for (const zone of noTreeZones) {
                const dx = Math.abs(x - zone.x);
                const dz = Math.abs(z - zone.z);
                
                if (dx < (zone.width / 2 + radius) && 
                    dz < (zone.depth / 2 + radius)) {
                    return true; // Находится в запретной зоне
                }
            }
            return false; // Не в запретной зоне
        }

        // Создание баскетбольного мяча
        function createBasketball(x, y, z) {
            const geometry = new THREE.SphereGeometry(0.4, 16, 16);
            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23FF8C00"/></svg>');
            const material = new THREE.MeshPhongMaterial({ 
                map: texture,
                color: 0xFF8C00
            });
            
            const ball = new THREE.Mesh(geometry, material);
            ball.position.set(x, y, z);
            ball.castShadow = true;
            ball.receiveShadow = true;
            
            scene.add(ball);
            basketballs.push(ball);
            return ball;
        }
        
        // Создание реалистичного комнатного растения в горшке
        function createIndoorPlant(posX, posY, posZ, scale = 1) {
            const plantGroup = new THREE.Group();
            
            // Керамический горшок
            const potGeo = new THREE.CylinderGeometry(0.4 * scale, 0.3 * scale, 0.5 * scale, 16);
            const potMat = new THREE.MeshPhongMaterial({ 
                color: 0xA0522D,
                shininess: 20
            });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.25 * scale;
            pot.castShadow = true;
            pot.receiveShadow = true;
            plantGroup.add(pot);
            
            // Земля в горшке
            const soilGeo = new THREE.CylinderGeometry(0.35 * scale, 0.35 * scale, 0.1 * scale, 16);
            const soilMat = new THREE.MeshPhongMaterial({ 
                color: 0x4A3728
            });
            const soil = new THREE.Mesh(soilGeo, soilMat);
            soil.position.y = 0.52 * scale;
            plantGroup.add(soil);
            
            // Главный стебель
            const stemGeo = new THREE.CylinderGeometry(0.04 * scale, 0.05 * scale, 1.2 * scale, 8);
            const stemMat = new THREE.MeshPhongMaterial({ 
                color: 0x2F5C2F,
                shininess: 10
            });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 1.15 * scale;
            stem.castShadow = true;
            plantGroup.add(stem);
            
            // Листья - простые овальные формы
            const leafMat = new THREE.MeshPhongMaterial({ 
                color: 0x3A8B3A,
                shininess: 25,
                side: THREE.DoubleSide
            });
            
            const darkLeafMat = new THREE.MeshPhongMaterial({ 
                color: 0x2D6B2D,
                shininess: 20,
                side: THREE.DoubleSide
            });
            
            // Создаем листья на разных уровнях
            const leafPositions = [
                { x: 0.3, y: 0.9, z: 0, rot: 0.5 },
                { x: -0.25, y: 1.0, z: 0.2, rot: -0.4 },
                { x: 0.2, y: 1.2, z: -0.25, rot: 0.6 },
                { x: -0.3, y: 1.3, z: -0.1, rot: -0.5 },
                { x: 0.15, y: 1.5, z: 0.2, rot: 0.3 },
                { x: -0.2, y: 1.6, z: 0, rot: -0.4 }
            ];
            
            leafPositions.forEach((pos, i) => {
                // Форма листа - сплюснутая сфера
                const leafGeo = new THREE.SphereGeometry(0.25 * scale, 10, 8);
                leafGeo.scale(0.5, 1, 1.8);
                
                const leaf = new THREE.Mesh(leafGeo, i % 2 === 0 ? leafMat : darkLeafMat);
                leaf.position.set(pos.x * scale, pos.y * scale, pos.z * scale);
                leaf.rotation.z = pos.rot;
                leaf.rotation.y = Math.atan2(pos.z, pos.x);
                
                leaf.castShadow = true;
                plantGroup.add(leaf);
            });
            
            // Простой красивый цветок
            const flowerGroup = new THREE.Group();
            flowerGroup.position.set(0, 1.75 * scale, 0);
            
            // Центр цветка
            const centerGeo = new THREE.SphereGeometry(0.1 * scale, 12, 12);
            const centerMat = new THREE.MeshPhongMaterial({ 
                color: 0xFFEB3B,
                shininess: 30
            });
            const center = new THREE.Mesh(centerGeo, centerMat);
            flowerGroup.add(center);
            
            // Лепестки - 6 штук, расположены по кругу
            const petalCount = 6;
            const petalMat = new THREE.MeshPhongMaterial({ 
                color: 0xFF5252,
                shininess: 35,
                side: THREE.DoubleSide
            });
            
            for (let i = 0; i < petalCount; i++) {
                const angle = (i / petalCount) * Math.PI * 2;
                
                // Лепесток - овальная форма
                const petalGeo = new THREE.SphereGeometry(0.12 * scale, 10, 8);
                petalGeo.scale(0.6, 1.5, 1);
                
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.set(
                    Math.cos(angle) * 0.18 * scale,
                    0,
                    Math.sin(angle) * 0.18 * scale
                );
                
                // Наклон лепестка
                petal.rotation.y = angle;
                petal.rotation.x = 0.4;
                
                petal.castShadow = true;
                flowerGroup.add(petal);
            }
            
            plantGroup.add(flowerGroup);
            
            // Один бутон сбоку
            const budGeo = new THREE.SphereGeometry(0.08 * scale, 10, 10);
            budGeo.scale(0.8, 1.4, 0.8);
            const budMat = new THREE.MeshPhongMaterial({ 
                color: 0xE53935,
                shininess: 25
            });
            const bud = new THREE.Mesh(budGeo, budMat);
            bud.position.set(0.25 * scale, 1.4 * scale, 0.15 * scale);
            bud.rotation.z = 0.3;
            bud.castShadow = true;
            plantGroup.add(bud);
            
            // Стебелек бутона
            const budStemGeo = new THREE.CylinderGeometry(0.02 * scale, 0.025 * scale, 0.35 * scale, 6);
            const budStemMat = new THREE.MeshPhongMaterial({ color: 0x2F5C2F });
            const budStem = new THREE.Mesh(budStemGeo, budStemMat);
            budStem.position.set(0.15 * scale, 1.22 * scale, 0.1 * scale);
            budStem.rotation.z = 0.4;
            plantGroup.add(budStem);
            
            plantGroup.position.set(posX, posY + 0.5 * scale, posZ);
            return plantGroup;
        }
        
        // Создание учебника
        function createTextbook(posX, posY, posZ, color = 0x4169E1, rotation = 0) {
            const bookGroup = new THREE.Group();
            
            // Обложка учебника
            const coverGeo = new THREE.BoxGeometry(0.25, 0.03, 0.35);
            const coverMat = new THREE.MeshPhongMaterial({ 
                color: color,
                shininess: 30
            });
            const cover = new THREE.Mesh(coverGeo, coverMat);
            cover.castShadow = true;
            bookGroup.add(cover);

        // Создание книжной полки
        function createBookshelf(posX, posY, posZ, rotation = 0) {
            const bookshelf = new THREE.Group();
            
            // Корпус полки
            const frameGeo = new THREE.BoxGeometry(3, 2.5, 0.4);
            const frameMat = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
            const frame = new THREE.Mesh(frameGeo, frameMat);

            bookshelf.add(frame);
            
            // Полки (горизонтальные доски)

            for (let i = 0; i < 5; i++) {
                const shelfGeo = new THREE.BoxGeometry(2.9, 0.05, 0.38);
                const shelf = new THREE.Mesh(shelfGeo, shelfMat);
                shelf.position.y = -1.2 + i * 0.6;
                bookshelf.add(shelf);
            }
            
            // Книги на полках
            const bookColors = [
                0x8B0000, 0x00008B, 0x006400, 0x8B008B, 
                0xFF8C00, 0x4B0082, 0xDC143C, 0x2F4F4F,
                0x8B4513, 0x483D8B, 0x2E8B57, 0xB8860B
            ];
            
            for (let shelf = 0; shelf < 4; shelf++) {
                const shelfY = -0.9 + shelf * 0.6;
                const booksOnShelf = 8 + Math.floor(Math.random() * 4);
                
                for (let i = 0; i < booksOnShelf; i++) {
                    const bookWidth = 0.08 + Math.random() * 0.12;
                    const bookHeight = 0.25 + Math.random() * 0.15;
                    const bookDepth = 0.3;
                    
                    const bookGeo = new THREE.BoxGeometry(bookWidth, bookHeight, bookDepth);
                    const bookMat = new THREE.MeshPhongMaterial({ 
                        color: bookColors[Math.floor(Math.random() * bookColors.length)],
                        shininess: 20
                    });
                    const book = new THREE.Mesh(bookGeo, bookMat);
                    
                    book.position.set(
                        -1.3 + (i * 0.25),
                        shelfY + bookHeight / 2,
                        0
                    );
                    
                    // Небольшой наклон для реалистичности
                    book.rotation.y = (Math.random() - 0.5) * 0.1;
                    book.rotation.z = (Math.random() - 0.5) * 0.05;
                    
                    book.castShadow = true;
                    bookshelf.add(book);
                }
            }
            
            bookshelf.position.set(posX, posY, posZ);
            bookshelf.rotation.y = rotation;

            function createWindow(x, y, z, rotationY, width = 4, height = 2.5) {

                // Стекло

                    details.add(flower);
                }
            }
            
            // Создаем 30 камней
            for (let i = 0; i < 30; i++) {
                let x, z;
                let validPosition = false;
                let attempts = 0;
                
                while (!validPosition && attempts < 30) {
                    x = Math.random() * 200 - 100;
                    z = Math.random() * 200 - 100;
                    
                    // Проверяем, не находится ли позиция на запретной зоне или внутри здания
                    if (!checkAnyCollision(x, z, 0.5) && !isInNoTreeZone(x, z, 0.5)) {
                        validPosition = true;
                    }
                    attempts++;
                }
                
                if (validPosition) {
                    const stone = createStone(x, z);
                    details.add(stone);
                }
            }
            
            env.add(details);
            
            return env;
        }
        
        // Создание круговой дорожки вокруг всех зданий (узкая и непрерывная)
        function createCircularPath() {
            const pathGroup = new THREE.Group();
            
            // Создаем круговую дорожку из сегментов
            const pathMaterial = new THREE.MeshPhongMaterial({ color: 0x3caa3c });
            const pathWidth = 4; // Уже дорожка
            const radius = 70; // Радиус как в предыдущих версиях
            
            // Создаем 24 сегмента для более плавного круга
            for (let i = 0; i < 25; i++) {
                const angle = (i / 25) * Math.PI * 2;
                const nextAngle = ((i + 1) / 25) * Math.PI * 2;
                
                const segment = new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        pathWidth, 
                        (Math.PI * 2 * radius) / 25
                    ),
                    pathMaterial
                );
                
                // Позиционируем сегмент по кругу
                segment.position.set(
                    Math.cos(angle) * radius,
                    0.01,
                    Math.sin(angle) * radius
                );
                
                // Поворачиваем сегмент по касательной к окружности
                segment.rotation.x = -Math.PI / 2;
                segment.rotation.z = -angle;
                
                pathGroup.add(segment);
                
                // Добавляем зону запрета для деревьев (круговая дорожка)
                noTreeZones.push({
                    x: Math.cos(angle) * radius,
                    z: Math.sin(angle) * radius,
                    width: pathWidth,
                    depth: (Math.PI * 2 * radius) / 25
                });
            }
            
            return pathGroup;
        }

        // Создание улыбающегося смайлика с красивыми глазами и изначальной улыбкой
        function createSmiley(radius) {
            const smileyGroup = new THREE.Group();
            
            // Лицо (желтый круг)
            const faceGeometry = new THREE.CircleGeometry(radius, 32);
            const faceMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFF00 });
            const face = new THREE.Mesh(faceGeometry, faceMaterial);
            smileyGroup.add(face);
            
            // Создание красивых глаз
            function createEye(x, y) {
                const eyeGroup = new THREE.Group();
                
                // Белок глаза
                const whiteGeometry = new THREE.CircleGeometry(radius * 0.15, 16);
                const whiteMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
                const eyeWhite = new THREE.Mesh(whiteGeometry, whiteMaterial);
                eyeGroup.add(eyeWhite);
                
                // Радужка (цветная часть)
                const irisGeometry = new THREE.CircleGeometry(radius * 0.08, 12);
                const irisMaterial = new THREE.MeshPhongMaterial({ color: 0x4169E1 }); // Royal Blue
                const iris = new THREE.Mesh(irisGeometry, irisMaterial);
                iris.position.z = 0.01;
                eyeGroup.add(iris);
                
                // Зрачок
                const pupilGeometry = new THREE.CircleGeometry(radius * 0.04, 8);
                const pupilMaterial = new THREE.MeshPhongMaterial({ color: 0x000000 });
                const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
                pupil.position.z = 0.02;
                eyeGroup.add(pupil);
                
                // Блик в глазу (создает эффект живости)
                const highlightGeometry = new THREE.CircleGeometry(radius * 0.02, 6);
                const highlightMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
                const highlight = new THREE.Mesh(highlightGeometry, highlightMaterial);
                highlight.position.set(radius * 0.03, radius * 0.03, 0.03);
                eyeGroup.add(highlight);
                
                // Веко (тонкая обводка)
                const eyelidGeometry = new THREE.RingGeometry(radius * 0.145, radius * 0.155, 16);
                const eyelidMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x000000,
                    side: THREE.DoubleSide
                });
                const eyelid = new THREE.Mesh(eyelidGeometry, eyelidMaterial);
                eyelid.position.z = 0.005;
                eyeGroup.add(eyelid);
                
                eyeGroup.position.set(x, y, 0.01);
                return eyeGroup;
            }
            
            // Левый глаз
            const leftEye = createEye(-radius * 0.3, radius * 0.2);
            smileyGroup.add(leftEye);
            
            // Правый глаз
            const rightEye = createEye(radius * 0.3, radius * 0.2);
            smileyGroup.add(rightEye);
            
            // Рот - изначальный вариант улыбки (крутая дуга)
            const smileCurve = new THREE.CubicBezierCurve3(
                new THREE.Vector3(-radius * 0.4, -radius * 0.4, 0.01),      // Начальная точка (опущена)
                new THREE.Vector3(-radius * 0.2, -radius * 0.7, 0.01),      // Контрольная точка 1 (сильно опущена)
                new THREE.Vector3(radius * 0.2, -radius * 0.7, 0.01),       // Контрольная точка 2 (сильно опущена)
                new THREE.Vector3(radius * 0.4, -radius * 0.4, 0.01)        // Конечная точка (опущена)
            );
            
            const smilePoints = smileCurve.getPoints(20);
            const smileGeometry = new THREE.BufferGeometry().setFromPoints(smilePoints);
            
            const smileMaterial = new THREE.LineBasicMaterial({ 
                color: 0x000000,
                linewidth: 3
            });
            
            // Основная линия улыбки
            const smileLine = new THREE.Line(smileGeometry, smileMaterial);
            smileyGroup.add(smileLine);
            
            // Дополнительная линия для объема улыбки
            const smileLine2 = new THREE.Line(smileGeometry, smileMaterial);
            smileLine2.position.z = 0.005;
            smileyGroup.add(smileLine2);
            
            // Легкий румянец на щеках (опущен и расположен снаружи)
            const blushGeometry = new THREE.CircleGeometry(radius * 0.15, 16);
            const blushMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xFFB6C1,
                transparent: true,
                opacity: 0.3
            });
            
            const leftBlush = new THREE.Mesh(blushGeometry, blushMaterial);
            leftBlush.position.set(-radius * 0.55, -radius * 0.2, 0.005);    // Опущен и снаружи
            smileyGroup.add(leftBlush);
            
            const rightBlush = new THREE.Mesh(blushGeometry, blushMaterial);
            rightBlush.position.set(radius * 0.55, -radius * 0.2, 0.005);     // Опущен и снаружи
            smileyGroup.add(rightBlush);
            
            return smileyGroup;
        }

                const hoopGroup = new THREE.Group();
                
                // Щит
                const backboard = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 1.8, 0.1),

                // Сетка для кольца (как снаружи)

                const netMaterial = new THREE.MeshPhongMaterial({

        // Переключение между внешним и внутренним видом
        function toggleSchoolEntrance() {
            if (isInsideSchool) {
                // Выходим из школы
                camera.position.set(50, 40, 80);
                controls.target.set(0, 0, 0);
                isInsideSchool = false;
                currentFloor = 1;
                currentBuilding = 1;
                scene.background = new THREE.Color(0x87CEEB);
                
                // Показываем внешнюю сцену, скрываем внутреннюю
                exteriorGroup.visible = true;
                interiorGroup.visible = false;
                interiorSecondFloorGroup.visible = false;
                interiorSecondBuildingGroup.visible = false;
                interiorSecondBuildingSecondFloorGroup.visible = false;
                
                // Обновляем кнопки
                document.getElementById('btnEnterExit').textContent = '🚪 Войти в школу';
                document.getElementById('btnFloor').disabled = true;
                document.getElementById('btnFloor').style.display = 'none';
                document.getElementById('btnBuilding').disabled = true;
                document.getElementById('btnBuilding').style.display = 'none';

            } else {
                // Входим в школу
                camera.position.set(0, 2.7, 3);
                controls.target.set(0, 2, 0);
                isInsideSchool = true;
                currentFloor = 1;
                currentBuilding = 1;
                scene.background = new THREE.Color(0x555555);
                
                // Сохраняем начальную позицию как валидную
                lastValidPosition.copy(camera.position);
                
                // Показываем внутреннюю сцену, скрываем внешнюю
                exteriorGroup.visible = false;
                interiorGroup.visible = true;
                interiorSecondFloorGroup.visible = false;
                interiorSecondBuildingGroup.visible = false;
                interiorSecondBuildingSecondFloorGroup.visible = false;
                
                // Обновляем кнопки
                document.getElementById('btnEnterExit').textContent = '🚪 Выйти из школы';
                document.getElementById('btnFloor').disabled = false;
                document.getElementById('btnFloor').style.display = '';
                document.getElementById('btnFloor').textContent = '⬆️ 2-й этаж';
                document.getElementById('btnBuilding').disabled = false;
                document.getElementById('btnBuilding').style.display = '';
                document.getElementById('btnBuilding').textContent = '🏫 Второй корпус';
            }
            controls.update();
        }
        
        // Переключение между этажами
        function toggleFloor() {
            if (!isInsideSchool) return;
            
            if (currentBuilding === 1) {
                // В первом корпусе
                if (currentFloor === 1) {
                    // Поднимаемся на второй этаж первого корпуса
                    currentFloor = 2;
                    interiorGroup.visible = false;
                    interiorSecondFloorGroup.visible = true;
                    interiorSecondBuildingGroup.visible = false;
                    interiorSecondBuildingSecondFloorGroup.visible = false;
                    
                    // Устанавливаем камеру около лестницы на втором этаже - ИСПРАВЛЕНО: нормальная высота
                    camera.position.set(-2, 2.7, -3); // Высота как на первом этаже
                    controls.target.set(0, 2.7, 7);
                    
                    document.getElementById('btnFloor').textContent = '⬇️ 1-й этаж';
                } else {
                    // Спускаемся на первый этаж первого корпуса
                    currentFloor = 1;
                    interiorGroup.visible = true;
                    interiorSecondFloorGroup.visible = false;
                    interiorSecondBuildingGroup.visible = false;
                    interiorSecondBuildingSecondFloorGroup.visible = false;
                    
                    // Возвращаем камеру на первый этаж
                    camera.position.set(0, 2.7, 3);
                    controls.target.set(0, 2, 0);
                    
                    document.getElementById('btnFloor').textContent = '⬆️ 2-й этаж';
                }
            } else {
                // Во втором корпусе
                if (currentFloor === 1) {
                    // Поднимаемся на второй этаж второго корпуса
                    currentFloor = 2;
                    interiorGroup.visible = false;
                    interiorSecondFloorGroup.visible = false;
                    interiorSecondBuildingGroup.visible = false;
                    interiorSecondBuildingSecondFloorGroup.visible = true;
                    
                    // Устанавливаем камеру около лестницы на втором этаже второго корпуса - ИСПРАВЛЕНО
                    camera.position.set(-2, 2.7, -3);
                    controls.target.set(0, 2.2, -2.5);
                    
                    document.getElementById('btnFloor').textContent = '⬇️ 1-й этаж';
                } else {
                    // Спускаемся на первый этаж второго корпуса
                    currentFloor = 1;
                    interiorGroup.visible = false;
                    interiorSecondFloorGroup.visible = false;
                    interiorSecondBuildingGroup.visible = true;
                    interiorSecondBuildingSecondFloorGroup.visible = false;
                    
                    // Возвращаем камеру на первый этаж второго корпуса
                    camera.position.set(7, 2.7, 0);
                    controls.target.set(-3, 2, 1);
                    
                    document.getElementById('btnFloor').textContent = '⬆️ 2-й этаж';
                }
            }
            
            // Сохраняем новую позицию как валидную
            lastValidPosition.copy(camera.position);
            
            controls.update();
        }
        
        // Переключение между корпусами
        function toggleBuilding() {
            if (!isInsideSchool) return;
            
            if (currentBuilding === 1) {
                // Переходим во второй корпус
                currentBuilding = 2;
                interiorGroup.visible = false;
                interiorSecondFloorGroup.visible = false;
                interiorSecondBuildingGroup.visible = true;
                interiorSecondBuildingSecondFloorGroup.visible = false;
                
                // Перемещаем камеру ко входу во втором корпусе
                camera.position.set(7, 2.7, 0);
                controls.target.set(-3, 2, 1);
                
                document.getElementById('btnBuilding').textContent = '🏫 Первый корпус';
                document.getElementById('btnFloor').textContent = '⬆️ 2-й этаж';
            } else {
                // Возвращаемся в первый корпус
                currentBuilding = 1;
                interiorGroup.visible = true;
                interiorSecondBuildingGroup.visible = false;
                interiorSecondBuildingSecondFloorGroup.visible = false;
                
                // Перемещаем камеру ко входу в первом корпусе
                camera.position.set(-12, 2.7, 1);
                controls.target.set(-3, 2, 0);
                
                document.getElementById('btnBuilding').textContent = '🏫 Второй корпус';
                document.getElementById('btnFloor').textContent = '⬆️ 2-й этаж';
            }
            
            currentFloor = 1;
            
            // Сохраняем новую позицию как валидную
            lastValidPosition.copy(camera.position);
            
            controls.update();
        }
        
        // Привязка кнопок
        document.getElementById('btnEnterExit').addEventListener('click', toggleSchoolEntrance);
        document.getElementById('btnFloor').addEventListener('click', toggleFloor);
        document.getElementById('btnBuilding').addEventListener('click', toggleBuilding);
        
        // Дополнительно можно оставить поддержку клавиш для удобства
        document.addEventListener('keydown', (event) => {
            if (event.code === 'KeyE') {
                toggleSchoolEntrance();
            }
            if (event.code === 'KeyF' && isInsideSchool) {
                toggleFloor();
            }
            if (event.code === 'KeyB' && isInsideSchool) {
                toggleBuilding();
            }
        });
        
        // Создание объектов сцены

        // Добавляем небо (светло-голубое)
        const sky = createSky();
        exteriorGroup.add(sky);
            
        // Добавляем солнце
        const sun = createSun();
        exteriorGroup.add(sun);

        const school = createSchool();
        exteriorGroup.add(school);
        
        // Добавляем внутренние помещения
        const schoolInterior = createSchoolInterior();
        interiorGroup.add(schoolInterior);
        
        const schoolInteriorSecondFloor = createSchoolInteriorSecondFloor();
        interiorSecondFloorGroup.add(schoolInteriorSecondFloor);
        
        const secondBuildingInterior = createSecondBuildingInterior();
        interiorSecondBuildingGroup.add(secondBuildingInterior);
        
        const secondBuildingSecondFloor = createSecondBuildingSecondFloor();
        interiorSecondBuildingSecondFloorGroup.add(secondBuildingSecondFloor);
        
        const environment = createEnvironment();
        exteriorGroup.add(environment);
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            // Сохраняем текущую позицию камеры
            const currentPosition = camera.position.clone();
            
            // Проверка столкновений камеры с внутренними стенами
            if (isInsideSchool) {
                if (!checkCameraInteriorCollision(camera.position)) {
                    // Если столкновений нет, сохраняем эту позицию как валидную
                    lastValidPosition.copy(camera.position);
                } else {
                    // Если есть столкновение, возвращаем камеру на последнюю валидную позицию
                    camera.position.copy(lastValidPosition);
                    // Также обновляем target контролов, чтобы не было резкого движения
                    controls.target.add(camera.position).sub(currentPosition);
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        // Создание неба (светло-голубое)
        function createSky() {
            const skyGeometry = new THREE.SphereGeometry(800, 32, 32);
            const skyMaterial = new THREE.MeshPhongMaterial({
                color: 0x87CEEB, // Светло-голубой цвет
                side: THREE.BackSide
            });
            
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            return sky;
        }
        
        // Создание солнца
        function createSun() {
            const sunGeometry = new THREE.SphereGeometry(5, 30, 30);
            const sunMaterial = new THREE.MeshBasicMaterial({
                color: 0xFFFF00,
                fog: false
            });
            
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(50, 60, 30);
            
            // Создаем свечение вокруг солнца
            const sunGlowGeometry = new THREE.SphereGeometry(7, 30, 30);
            const sunGlowMaterial = new THREE.MeshBasicMaterial({
                color: 0xFFFF00,
                transparent: true,
                opacity: 0.3
            });
            
            const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
            sun.add(sunGlow);
            
            return sun;
        }
    </script>
</body>
</html>
